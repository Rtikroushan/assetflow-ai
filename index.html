<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/png" href="/assetflow-mark.png" /> -->

    <link rel="icon" type="image/png" sizes="60x60" href="/assetflow-mark.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssetFlow AI — Intelligent Enterprise Asset Management</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('assetflow_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
